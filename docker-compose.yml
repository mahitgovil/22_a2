# One command to run everything:
#   docker compose up --build            (databases + app on http://localhost:4000)
#   docker compose --profile seed run --rm seed      (load the 50k+ rows of data, once)
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gigtask
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql:/sql:ro
      - ./docker/init-postgres.sh:/docker-entrypoint-initdb.d/10-init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gigtask"]
      interval: 3s
      retries: 20

  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    volumes:
      - mongodata:/data/db
      - ./mongo/01_collections_and_indexes.js:/docker-entrypoint-initdb.d/01_collections_and_indexes.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 3s
      retries: 20

  app:
    build: .
    environment:
      POSTGRES_DSN: postgresql://postgres:postgres@postgres:5432/gigtask
      MONGO_URI: mongodb://mongo:27017
      SIMULATE_PINGS: "1"
    ports: ["4000:4000"]
    depends_on:
      postgres: { condition: service_healthy }
      mongo: { condition: service_healthy }

  seed:
    profiles: ["seed"]
    image: python:3.12-slim
    working_dir: /app
    volumes: ["./data_generation:/app"]
    environment:
      POSTGRES_DSN: postgresql://postgres:postgres@postgres:5432/gigtask
      MONGO_URI: mongodb://mongo:27017
    command: sh -c "pip install -q -r requirements.txt && python postgres_seeder.py && python mongo_seeder.py"
    depends_on:
      postgres: { condition: service_healthy }
      mongo: { condition: service_healthy }

volumes:
  pgdata:
  mongodata:
